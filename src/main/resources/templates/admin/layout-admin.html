<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin}">
<head>
  <meta charset="UTF-8">
  <title>Category AJAX</title>

</head>
<body>
<section layout:fragment="content">
 
<!--nạp jQuery -->
<script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
<script th:inline="javascript">
    var contextPath = /*[[@{/}]]*/ '/';
    contextPath = contextPath.replace(/\/$/, '');   // bỏ dấu / ở cuối
</script>
 
<h3>Quản lý Category (AJAX)</h3>
 
<p>
  <button class="btn btn-success" onclick="showCreateNewCategoryModal()">
    <i class="fas fa-plus me-1"></i>Thêm Category Ajax
  </button>
</p>
 
<table id="categoryTable" class="table table-striped table-responsive">
  <thead>
    <tr><th>Id</th><th>Icon</th><th>Name</th><th>Actions</th></tr>
  </thead>
  <tbody></tbody>
</table>
 
<!-- ============ Modal THÊM ============ -->
<div class="modal fade" tabindex="-1" id="createCategoryModal">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="addCategory" method="post" enctype="multipart/form-data">
        <div class="modal-header">
          <h5 class="modal-title">Add Category</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label for="new_categoryname" class="form-label">Category Name</label>
            <input type="text" class="form-control" id="new_categoryname" name="categoryName" required>
          </div>
          <div class="mb-3">
            <label for="new_icon" class="form-label">Icon</label>
            <input type="file" class="form-control" id="new_icon" name="icon">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
          <button type="submit" class="btn btn-primary">Add</button>
        </div>
      </form>
    </div>
  </div>
</div>
 
<!-- ============ Modal CẬP NHẬT ============ -->
<div class="modal fade" tabindex="-1" id="updateCategoryInfoModal">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Update Category</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="card">
          <div class="card-header"><h5>Category hiện tại</h5></div>
          <div class="card-body pb-0">
            <p id="updateCategoryInfoModalId"></p>
            <p id="updateCategoryInfoModalName"></p>
            <p id="updateCategoryInfoModalIcon"></p>
          </div>
        </div>
        <div class="card mt-2">
          <div class="card-header"><h5>Cập nhật</h5></div>
          <div class="card-body pb-0">
            <form id="updateCategory" method="post" enctype="multipart/form-data">
            	<div class="mb-3">
                <label for="categoryName_up" class="form-label">Category Name</label>
                <input type="text" class="form-control" id="categoryName_up" name="categoryName" required>
              </div>
              <div class="mb-3">
                <label for="icon_up" class="form-label">Icon</label>
                <input type="file" class="form-control" id="icon_up" name="icon">
              </div>
              <input type="hidden" id="categoryId_up" name="categoryId">
              <div class="text-center mb-3">
                <button type="submit" class="btn btn-primary w-100">Cập nhật</button>
              </div>
            </form>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
      </div>
    </div>
  </div>
</div>
 
<script type="text/javascript">
// Chống chèn HTML/JS từ dữ liệu người dùng nhập (XSS)
function esc(s) {
    return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
 
/* ---------- 1. HIỂN THỊ DANH SÁCH ---------- */
function loadCategories() {
    $.getJSON(contextPath + '/api/category', function (res) {
        var list = res.body ? res.body : res;     // hỗ trợ cả 2 dạng response
        var rows = [];
        $.each(list, function (i, c) {
            var img = c.icon
                ? '<img src="' + contextPath + '/admin/categories/images/' + c.icon
                  + '" style="width:70px" class="img-fluid" alt="">'
                : '';
            rows.push(
                '<tr>' +
                '<td>' + c.categoryId + '</td>' +
                '<td>' + img + '</td>' +
                '<td>' + esc(c.categoryName) + '</td>' +
                '<td>' +
                  '<a href="#" class="btn btn-outline-warning btn-edit me-1"' +
                     ' data-id="' + c.categoryId + '"' +
                     ' data-name="' + esc(c.categoryName) + '"' +
                     ' data-icon="' + esc(c.icon) + '"><i class="fa fa-edit"></i></a>' +
                  '<a href="#" class="btn btn-outline-danger btn-delete"' +
                     ' data-id="' + c.categoryId + '"><i class="fa fa-trash"></i></a>' +
                '</td>' +
                '</tr>');
        });
        $('#categoryTable tbody').html(rows.join(''));
    });
}
 
$(document).ready(function () {
    loadCategories();
 
    /* ---------- 2. THÊM ---------- */
    $('#addCategory').submit(function (e) {
        e.preventDefault();
        $.ajax({
            url: contextPath + '/api/category/addCategory',
            type: 'POST',
            dataType: 'json',
            data: new FormData(this),
            cache: false,
            contentType: false,      // để trình duyệt tự đặt multipart/form-data
            processData: false,      // không biến FormData thành query string
            success: function (res) {
                bootstrap.Modal.getInstance(document.getElementById('createCategoryModal')).hide();
                loadCategories();
            },
            error: function (xhr) {
                alert(xhr.responseJSON ? xhr.responseJSON.message : 'Có lỗi xảy ra');
            }
        });
    });
 
    /* ---------- 3. SỬA ---------- */
    $(document).on('click', '.btn-edit', function (e) {
        e.preventDefault();
        var b = $(this);
        showEditCategoryModal(b.data('id'), b.data('name'), b.data('icon'));
    });
 
    $('#updateCategory').submit(function (e) {
        e.preventDefault();
        $.ajax({
            url: contextPath + '/api/category/updateCategory',
            type: 'PUT',
            dataType: 'json',
            data: new FormData(this),
            cache: false,
            contentType: false,
            processData: false,
            success: function (res) {
                bootstrap.Modal.getInstance(document.getElementById('updateCategoryInfoModal')).hide();
                loadCategories();
            },
            error: function (xhr) {
                alert(xhr.responseJSON ? xhr.responseJSON.message : 'Có lỗi xảy ra');
            }
        });
    });
 
    /* ---------- 4. XÓA ---------- */
    $(document).on('click', '.btn-delete', function (e) {
        e.preventDefault();
        var id = $(this).data('id');
        if (confirm('Bạn có chắc muốn xóa category này?')) {
            $.ajax({
                type: 'DELETE',
                url: contextPath + '/api/category/deleteCategory?categoryId=' + id,
                dataType: 'json',
                success: function () { loadCategories(); },
                error: function (xhr) {
                    alert(xhr.responseJSON ? xhr.responseJSON.message : 'Có lỗi xảy ra');
                }
            });
        }
    });
});
 
function showCreateNewCategoryModal() {
    $('#addCategory')[0].reset();
    bootstrap.Modal.getOrCreateInstance(document.getElementById('createCategoryModal')).show();
}
 
function showEditCategoryModal(categoryId, categoryName, icon) {
    $('#updateCategoryInfoModalId').text('Category ID: ' + categoryId);
    $('#updateCategoryInfoModalName').text('Category Name: ' + categoryName);
    $('#updateCategoryInfoModalIcon').text('Icon: ' + icon);
    $('#categoryName_up').val(categoryName);
    $('#categoryId_up').val(categoryId);
    $('#icon_up').val('');
    bootstrap.Modal.getOrCreateInstance(document.getElementById('updateCategoryInfoModal')).show();
}
</script>
 
</section>
</body>
</html>
